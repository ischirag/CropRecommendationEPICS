<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crop Recommendation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/">🌾 Smart Crop Advisor</a>
      </div>
    </nav>

    <div class="container">
      <!-- Weather Card -->
      <div class="card mb-4 shadow-sm">
        <div class="card-body">
          <h5 class="card-title">📍 Bhopal Weather</h5>
          <div class="row">
            <div class="col-md-6">
              <p class="mb-1">Temperature: {{ weather.temperature }}°C</p>
            </div>
            <div class="col-md-6">
              <p class="mb-1">Humidity: {{ weather.humidity }}%</p>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-8">
          <div class="card shadow-sm">
            <div class="card-body">
              <h4 class="card-title text-center mb-4">Crop Recommendation Form</h4>
              <form action="/predict" method="POST">
                <input type="hidden" name="Nitrogen" value="80">
                <input type="hidden" name="Phosporus" value="45">
                <input type="hidden" name="Potassium" value="40">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Moisture (%)</label>
                    <input type="number" step="0.01" name="Moisture" class="form-control" value="{{ request.form.get('Moisture', '50') }}" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Temperature (°C)</label>
                    <input type="number" step="0.01" name="Temperature" class="form-control" value="{{ request.form.get('Temperature', weather.temperature) }}" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Humidity (%)</label>
                    <input type="number" step="0.01" name="Humidity" class="form-control" value="{{ request.form.get('Humidity', weather.humidity) }}" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">pH Level</label>
                    <input type="number" step="0.01" name="pH" class="form-control" value="{{ request.form.get('pH', '6.5') }}" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Rainfall (mm)</label>
                    <input type="number" step="0.01" name="Rainfall" class="form-control" value="{{ request.form.get('Rainfall', '202.9') }}" required>
                  </div>
                </div>
                <div class="text-center mt-4">
                  <button type="submit" class="btn btn-success btn-lg px-5">Get Recommendation</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          {% if result %}
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title text-success">Recommendation Result</h5>
              <p class="card-text">{{ result }}</p>
              {% if crop_info %}
              <hr>
              <h6 class="card-subtitle mb-2 text-muted">Crop Information</h6>
              <p class="card-text">{{ crop_info }}</p>
              {% endif %}
            </div>
          </div>
          {% endif %}
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
